server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Signed contracts must never be cached by an intermediary, and the app has
    # no reason to be framed or sniffed.
    # SAMEORIGIN: the contract page shows the PDF editor (/editor/) in a frame
    # of its own origin. Other sites still cannot frame the app.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;

    server_tokens off;

    # Visitors through the Cloudflare Tunnel (the `cloudflared` container,
    # docker-compose.yml) arrive from that container; their own address is in
    # CF-Connecting-IP. Only that container is believed, so a visitor on the
    # office network cannot claim another address with the header.
    set_real_ip_from 172.28.0.20;
    real_ip_header CF-Connecting-IP;

    # Single-page app: unknown paths fall through to the router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built files carry a content hash in their name: kept by the browser for good.
    # (add_header here replaces the server-level headers, so they are repeated.)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The API lives behind the same origin in production, so no CORS preflight
    # and no API host baked into the bundle.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 60m;
        proxy_read_timeout 300s;
        # PDFs carry personal data; keep them out of any shared cache.
        add_header Cache-Control "no-store" always;
    }
}
